app.auth.secure-cookie=false
app.auth.otp-secret=${APP_OTP_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
spring.config.import=optional:file:.env.local[.properties],optional:file:ancu-proptech-backend/.env.local[.properties]
# Vite can select 3001/3002 when earlier development servers still occupy 3000.
app.auth.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://192.168.*:*,http://10.*:*,http://172.16.*:*}
# Local development fallback defaults (can be overridden by .env.local or environment variables)
app.auth.local-owner-email=${LOCAL_OWNER_EMAIL:owner@ancu.local}
app.auth.local-owner-password=${LOCAL_OWNER_PASSWORD:LocalPassword123!}
app.auth.local-customer-password=${LOCAL_CUSTOMER_PASSWORD:LocalPassword123!}
app.billing.tenant-one-password=${LOCAL_TENANT_1_PASSWORD:LocalPassword123!}
app.billing.tenant-two-password=${LOCAL_TENANT_2_PASSWORD:LocalPassword123!}

