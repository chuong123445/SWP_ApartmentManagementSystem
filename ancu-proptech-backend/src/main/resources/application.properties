
# Local SQL Server configuration (UTF-8).
spring.application.name=proptech

app.auth.otp-secret=${APP_OTP_SECRET:}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# IDE Run/main uses local unless an active profile is explicitly configured.
spring.profiles.active=local

server.port=8080

app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.secure-cookie=${APP_SECURE_COOKIE:true}
app.auth.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:*,http://10.*:*,http://172.16.*:*}
app.auth.access-seconds=${APP_ACCESS_SECONDS:900}
app.auth.refresh-seconds=${APP_REFRESH_SECONDS:604800}

# Local development accounts
app.auth.local-owner-email=${LOCAL_OWNER_EMAIL:owner@ancu.local}
app.auth.local-owner-password=${LOCAL_OWNER_PASSWORD:LocalPassword123!}

app.auth.local-customer-email=${LOCAL_CUSTOMER_EMAIL:customer@ancu.local}
app.auth.local-customer-password=${LOCAL_CUSTOMER_PASSWORD:LocalPassword123!}

# Seed data
app.seed.enabled=${APP_SEED_DATA:true}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__auth.sql,classpath:db/migration/V2__discovery_rental.sql,classpath:db/migration/V3__unify_apartments.sql,classpath:db/migration/V4__import_legacy_rooms.sql,classpath:db/migration/V5__tenant_billing.sql,classpath:db/migration/V6__account_profile_email.sql,classpath:db/migration/V7__rental_decision_reason.sql,classpath:db/migration/V8__property_rental_mode.sql,classpath:db/migration/V9__property_dossiers.sql,classpath:db/migration/V10__contract_drafts.sql,classpath:db/migration/V11__account_identity.sql,classpath:db/migration/V12__legal_profile_metadata.sql,classpath:db/migration/V13__auth_external_identity.sql,classpath:db/migration/V14__owner_upgrades.sql,classpath:db/migration/V15__auth0_property_imports.sql,classpath:db/migration/V16__property_rights_onboarding.sql,classpath:db/migration/V17__property_right_notices.sql,classpath:db/migration/V18__property_images_prices_identity.sql,classpath:db/migration/V19__numeric_identity_ids.sql,classpath:db/migration/V20__external_property_receiving_account.sql,classpath:db/migration/V21__external_account_reauthentication.sql,classpath:db/migration/V22__property_source_consent.sql,classpath:db/migration/V23__sepay_invoice_payments.sql,classpath:db/migration/V24__sepay_owner_event_dedup.sql,classpath:db/migration/V25__sepay_test_payments.sql,classpath:db/migration/V26__sepay_test_payment_recipients.sql,classpath:db/migration/V27__contract_signatures.sql,classpath:db/migration/V28__contract_lifecycle.sql,classpath:db/migration/V29__maintenance_tickets.sql,classpath:db/migration/V30__maintenance_workflow.sql,classpath:db/migration/V31__maintenance_resolution.sql,classpath:db/migration/V32__maintenance_costs.sql,classpath:db/migration/V33__maintenance_images.sql,classpath:db/migration/V34__dossier_ai_reviews.sql,classpath:db/migration/V35__cash_entries.sql
app.billing.local-fixtures=${APP_BILLING_FIXTURES:true}
app.billing.tenant-one-email=${LOCAL_TENANT_1_EMAIL:tenant1@ancu.local}
app.billing.tenant-one-password=${LOCAL_TENANT_1_PASSWORD:LocalPassword123!}
app.billing.tenant-two-email=${LOCAL_TENANT_2_EMAIL:tenant2@ancu.local}
app.billing.tenant-two-password=${LOCAL_TENANT_2_PASSWORD:LocalPassword123!}

spring.sql.init.separator=GO

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=proptech_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=24MB

# Auth0 VNeID is opt-in; no network call until the feature is used.
app.auth.vneid.enabled=${AUTH0_VNEID_ENABLED:false}
app.auth.vneid.issuer=${AUTH0_ISSUER:}
app.auth.vneid.client-id=${AUTH0_CLIENT_ID:}
app.auth.vneid.audience=${AUTH0_AUDIENCE:}
app.auth.vneid.connection=${AUTH0_CONNECTION:Username-Password-Authentication}
app.auth.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID:}
app.auth.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET:}

# Public HTTPS origin used for SePay webhook URLs. Never derive from untrusted Host headers.
app.payment.public-base-url=${APP_PUBLIC_BASE_URL:}

app.payment.sepay-mode=${SEPAY_MODE:live}
# AI chỉ hỗ trợ đối chiếu, không thực hiện quyết định kiểm duyệt.
app.dossier-ai.enabled=${DOSSIER_AI_ENABLED:false}
app.dossier-ai.api-key=${GEMINI_API_KEY:}
app.dossier-ai.model=${GEMINI_MODEL:}
