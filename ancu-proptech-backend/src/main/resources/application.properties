# Local SQL Server configuration (UTF-8).
spring.application.name=proptech
app.auth.otp-secret=${APP_OTP_SECRET:}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# IDE Run/main uses local unless an active profile is explicitly configured.
spring.profiles.active=local

server.port=8080

app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.secure-cookie=${APP_SECURE_COOKIE:true}
app.auth.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://192.168.*:*,http://10.*:*,http://172.16.*:*}
app.auth.access-seconds=${APP_ACCESS_SECONDS:900}
app.auth.refresh-seconds=${APP_REFRESH_SECONDS:604800}
app.auth.local-owner-email=${LOCAL_OWNER_EMAIL:}
app.auth.local-owner-password=${LOCAL_OWNER_PASSWORD:}
app.auth.local-customer-email=${LOCAL_CUSTOMER_EMAIL:customer@ancu.local}
app.auth.local-customer-password=${LOCAL_CUSTOMER_PASSWORD:}
app.seed.enabled=${APP_SEED_DATA:true}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__auth.sql,classpath:db/migration/V2__discovery_rental.sql,classpath:db/migration/V3__unify_apartments.sql,classpath:db/migration/V4__import_legacy_rooms.sql,classpath:db/migration/V5__tenant_billing.sql,classpath:db/migration/V6__account_profile_email.sql,classpath:db/migration/V7__rental_decision_reason.sql,classpath:db/migration/V8__property_rental_mode.sql,classpath:db/migration/V9__property_dossiers.sql,classpath:db/migration/V10__contract_drafts.sql,classpath:db/migration/V11__account_identity.sql,classpath:db/migration/V12__legal_profile_metadata.sql,classpath:db/migration/V13__apartment_edit_approval.sql,classpath:db/migration/V14__apartment_sample_images.sql
app.billing.local-fixtures=${APP_BILLING_FIXTURES:true}
app.billing.tenant-one-email=${LOCAL_TENANT_1_EMAIL:tenant1@ancu.local}
app.billing.tenant-one-password=${LOCAL_TENANT_1_PASSWORD:}
app.billing.tenant-two-email=${LOCAL_TENANT_2_EMAIL:tenant2@ancu.local}
app.billing.tenant-two-password=${LOCAL_TENANT_2_PASSWORD:}
spring.sql.init.separator=GO

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=proptech_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
